name: Build & Deploy – Web/PWA, Linux (Lumos) & Store

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: /home/runner/godot/godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Godot + Web-Templates aus dem Cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot
            /home/runner/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-linux

      - name: Godot installieren
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /home/runner/godot
          cd /home/runner/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=/home/runner/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -j templates.tpz 'templates/web*' 'templates/linux_release.x86_64' 'templates/version.txt' -d "$T"
          rm templates.tpz

      - name: Firebase-Konfiguration prüfen (GDScript = Web-SDK, API-Key von Google akzeptiert)
        run: python3 tools/check_firebase_config.py

      - name: Asset-Inventur & Katalog prüfen
        run: |
          python3 tools/asset_pipeline.py --check
          python3 tools/validate_catalog.py
          python3 tools/validate_controls.py

      - name: Import-Cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('data/asset_inventory.json', 'project.godot') }}-${{ github.sha }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('data/asset_inventory.json', 'project.godot') }}-

      - name: Assets importieren
        run: |
          timeout 1800 $GODOT_BIN --headless --path . --import || true
          timeout 600 $GODOT_BIN --headless --path . --import

      - name: Skripte & Szenen prüfen
        run: |
          timeout 300 $GODOT_BIN --headless --path . res://tools/dev/Check.tscn 2>&1 | tee check.log
          ! grep -q "SCRIPT ERROR" check.log

      - name: System-Tests (CPU-Stufen, Inventar, Items, Emotes, Steuerung, Touch)
        run: |
          timeout 300 $GODOT_BIN --headless --path . res://tools/dev/Run.tscn -- --dev-script=res://tools/dev/test_systems.gd 2>&1 | tee systems.log
          grep -q "TESTS OK" systems.log
          ! grep -q "SCRIPT ERROR" systems.log

      - name: Langzeit-Test (Party über 12 Runden, Speicher-/Objekt-Lecks, Hänger)
        run: |
          timeout 900 $GODOT_BIN --headless --fixed-fps 60 --path . res://tools/dev/Run.tscn -- --dev-script=res://tools/dev/soak.gd --rounds=12 2>&1 | tee soak.log
          grep "\[SOAK\]" soak.log | tail -5
          grep -q "SOAK OK" soak.log
          ! grep -q "SCRIPT ERROR" soak.log

      - name: Export-Liste erzeugen
        run: timeout 300 $GODOT_BIN --headless --path . res://tools/dev/Run.tscn -- --dev-script=res://tools/export_list.gd

      - name: Online-Test (2–3 Instanzen, lokaler RTDB-Ersatz, Relay)
        run: |
          HEADLESS=1 GODOT=$GODOT_BIN bash tools/dev/net_test.sh build/net-race race lumos_ring
          HEADLESS=1 GODOT=$GODOT_BIN PORT=9124 bash tools/dev/net_test.sh build/net-sumo sumo_shove
          # Online-Brett mit 3 Geräten: verschiedene Figuren, ein bedienender Mensch-Gast – prüft Spielerliste,
          # eindeutige Plätze, Bedienung nur für den eigenen Platz und identischen Brettzustand
          HEADLESS=1 GODOT=$GODOT_BIN PORT=9125 CLIENTS=2 HUMAN=1 HEROES="knight ranger mage" DUR_PARTY=240 bash tools/dev/net_test.sh build/net-party party meadow
          # Schlechte Verbindung: bis 300 ms Verzögerung, 5 % verlorene Anfragen – Rennen muss gleich enden
          MOCK_DELAY_MS=300 MOCK_FAIL_PCT=5 HEADLESS=1 GODOT=$GODOT_BIN PORT=9126 bash tools/dev/net_test.sh build/net-lossy race lumos_ring
          # Host-Absturz mitten im Brettspiel: Gäste müssen es bemerken und ohne Fehler zurück ins Menü
          HOST_CRASH=60 HEADLESS=1 GODOT=$GODOT_BIN PORT=9127 CLIENTS=2 bash tools/dev/net_test.sh build/net-crash party meadow

      - name: Online-Test-Logs (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: net-test-logs
          path: build/net-*
          if-no-files-found: ignore

      - name: Web-Export (WebGL2, ohne Threads – läuft auf Vercel, GitHub Pages & iOS)
        run: |
          mkdir -p build/web
          timeout 900 $GODOT_BIN --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      - name: PWA & Store-Paket
        run: python3 tools/postexport_pwa.py build/web --zip

      - name: Linux-Export (eingebettetes PCK, für Lumos-Sideload)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/linux
          timeout 900 $GODOT_BIN --headless --path . --export-release "Linux" build/linux/lumos-party.x86_64
          cp build/linux/lumos-party.x86_64 build/lumos-party-linux.x86_64
          cp tools/lumos/install_lumos.py build/install_lumos.py

      - name: Rauchtest im Browser (Chromium/WebGL2, inkl. Audio)
        run: |
          npm install --no-save playwright@1.49.1
          # System-Pakete nur nach bestem Bemühen: Die Runner-Images bringen die nötigen Bibliotheken mit, und
          # ein Ausfall der Ubuntu-Paketserver (DNS) soll den Rauchtest nicht verhindern.
          timeout 300 npx playwright install-deps chromium || echo "::warning::playwright install-deps fehlgeschlagen – nutze vorhandene Systembibliotheken"
          npx playwright install chromium
          (cd build/web && python3 -m http.server 8765 &) && sleep 2
          node tools/web_smoke_test.js http://localhost:8765/

      - name: Vercel-Deployment (nur wenn VERCEL_TOKEN gesetzt ist)
        if: github.event_name != 'pull_request' && env.HAS_VERCEL == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@39 deploy build/web --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: lumos-party-web
          path: |
            build/lumos-party-web.zip
            build/web/lumos-app.json
            build/lumos-party-linux.x86_64
            build/install_lumos.py
          if-no-files-found: warn

  deploy-pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages muss EINMAL aktiviert sein (Settings → Pages → Source: „GitHub Actions“). Mit einem
      # Repository-Secret PAGES_TOKEN (Fine-grained PAT: Administration + Pages: write) schaltet der Workflow
      # Pages auch selbst ein.
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: ${{ secrets.PAGES_TOKEN != '' }}
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Live-URL
        run: echo "::notice title=Live::${{ steps.deployment.outputs.page_url }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumos-party-web
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lumos-party-web.zip
            dist/web/lumos-app.json
            dist/lumos-party-linux.x86_64
            dist/install_lumos.py
          generate_release_notes: true
