<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#1a0f3d">
	<meta name="description" content="Lumos Party & Nitro Dash – das chaotische 3D-Party-Brettspiel mit 38 Minispielen und ein Arcade-Racer. Exklusiv für Lumos OS, spielbar in jedem Browser.">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Lumos Party">
	<meta name="format-detection" content="telephone=no">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
	<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
@font-face { font-family: "Lilita"; src: url("brand/LilitaOne-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Fredoka"; src: url("brand/Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: swap; }
:root { --bg: #1a0f3d; --bg2: #2b1466; --pink: #ff5fae; --gold: #ffcf3a; --blue: #58c2ff; --mint: #6ee7c8; --ink: #2a1250; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff;
	-webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
	font-family: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
#canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
#canvas:focus { outline: none; }

/* --- Ladebildschirm --- */
#splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
	background: radial-gradient(120% 90% at 50% 18%, #5a2fc4 0%, var(--bg2) 38%, var(--bg) 78%); transition: opacity .55s ease; overflow: hidden; }
#splash.hidden { opacity: 0; pointer-events: none; }
#splash::before { content: ""; position: absolute; inset: -10%; pointer-events: none; opacity: .55;
	background-image: radial-gradient(2px 2px at 12% 22%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 78% 14%, #fff 50%, transparent 51%),
		radial-gradient(2px 2px at 64% 72%, #ffe9a8 50%, transparent 51%), radial-gradient(1.5px 1.5px at 30% 82%, #fff 50%, transparent 51%),
		radial-gradient(2.5px 2.5px at 88% 58%, #c9b8ff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 44% 8%, #fff 50%, transparent 51%),
		radial-gradient(2px 2px at 6% 64%, #ffd1ec 50%, transparent 51%), radial-gradient(1.5px 1.5px at 92% 88%, #fff 50%, transparent 51%);
	animation: twinkle 4s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; transform: translateY(0); } to { opacity: .7; transform: translateY(-8px); } }
.hill { position: absolute; left: -10%; right: -10%; bottom: -1px; height: 22vh; border-radius: 50% 50% 0 0 / 100% 100% 0 0; pointer-events: none; }
.hill.back { background: #3b1f86; bottom: 4vh; opacity: .7; transform: scaleX(1.2); }
.hill.front { background: #2a1468; }
#stage { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 1; padding: 0 16px; }
#halo { position: absolute; top: 2%; width: min(52vmin, 420px); aspect-ratio: 1; border-radius: 50%;
	background: radial-gradient(circle, rgba(255,214,120,.55) 0%, rgba(255,120,200,.25) 38%, transparent 68%); filter: blur(4px);
	animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(.94); opacity: .8; } 50% { transform: scale(1.06); opacity: 1; } }
#logo { position: relative; width: min(48vmin, 360px); height: auto; filter: drop-shadow(0 14px 18px rgba(10,0,40,.45));
	animation: drive 2.2s ease-in-out infinite; transform-origin: 50% 85%; }
@keyframes drive { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
h1 { margin: 6px 0 0; font-family: "Lilita", "Trebuchet MS", sans-serif; font-weight: 400; font-size: min(10vmin, 72px); line-height: 1;
	letter-spacing: 1px; color: #fff; -webkit-text-stroke: 0; text-shadow: 0 4px 0 var(--ink), 0 6px 0 #8a3cff, 0 12px 22px rgba(0,0,0,.45); }
h1 .o { color: var(--gold); }
#sub { margin: 10px 0 22px; font-family: "Lilita", sans-serif; font-size: min(4.2vmin, 24px); letter-spacing: 3px; color: var(--ink);
	background: linear-gradient(180deg, #ffe680, var(--gold)); padding: 5px 18px 4px; border-radius: 999px;
	box-shadow: 0 4px 0 #c98a12, 0 8px 18px rgba(0,0,0,.35); }
#bar { position: relative; width: min(72vw, 460px); height: 22px; border-radius: 999px; background: rgba(18,6,48,.65);
	border: 3px solid rgba(255,255,255,.9); box-shadow: 0 5px 0 rgba(0,0,0,.25), inset 0 3px 6px rgba(0,0,0,.35); overflow: visible; }
#fill { position: relative; height: 100%; width: 3%; border-radius: 999px; transition: width .25s ease-out;
	background: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, rgba(255,255,255,0) 10px 20px), linear-gradient(90deg, var(--pink), var(--gold) 55%, var(--mint));
	background-size: 28px 28px, 100% 100%; animation: stripes .8s linear infinite; }
@keyframes stripes { from { background-position: 0 0, 0 0; } to { background-position: 28px 0, 0 0; } }
#knob { position: absolute; right: -14px; top: 50%; width: 30px; height: 30px; transform: translateY(-50%);
	filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
#status { margin-top: 14px; font-size: 16px; font-weight: 600; min-height: 22px; text-align: center; color: rgba(255,255,255,.92); }
#tip { margin-top: 6px; font-size: 14px; min-height: 20px; text-align: center; color: rgba(255,255,255,.6); max-width: 520px; transition: opacity .4s; }
#retry { display: none; margin-top: 14px; border: 0; border-radius: 999px; padding: 10px 22px; font: 700 16px "Fredoka", sans-serif; color: var(--ink);
	background: linear-gradient(180deg, #fff, #e6dcff); box-shadow: 0 5px 0 #8a7ac8; cursor: pointer; }
#retry:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a7ac8; }
#ver { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2;
	font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,.45); }
#splash.error #fill { background: #e8364f; animation: none; }
@media (max-height: 420px) { #logo { width: 30vmin; } #sub { margin: 6px 0 12px; } #tip { display: none; } }
@media (prefers-reduced-motion: reduce) { #logo, #halo, #fill, #knob, #splash::before { animation: none; } }

#install { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 20;
	display: none; border: 0; border-radius: 22px; padding: 12px 20px; font-size: 16px; font-weight: 700; color: #fff;
	background: var(--pink); box-shadow: 0 6px 0 #a02a76, 0 10px 24px rgba(0,0,0,.4); cursor: pointer; }
#install:active { transform: translateY(4px); box-shadow: 0 2px 0 #a02a76; }
#rotate { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center;
	background: var(--bg); text-align: center; font-size: 20px; }
#rotate .phone { width: 64px; height: 108px; border: 5px solid #fff; border-radius: 14px; margin-bottom: 18px; animation: turn 2s ease-in-out infinite; }
@keyframes turn { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
#ios-hint { display: none; position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
	background: rgba(23,11,51,.92); border: 2px solid rgba(255,255,255,.2); border-radius: 16px; padding: 10px 16px; font-size: 14px; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas" tabindex="0">Dein Browser unterstützt kein HTML5-Canvas.</canvas>

	<div id="splash">
		<div class="hill back"></div><div class="hill front"></div>
		<div id="stage">
			<div id="halo"></div>
			<img id="logo" src="brand/logo.png" alt="Held im Kart mit Party-Stern">
			<h1>LUM<span class="o">O</span>S PARTY</h1>
			<div id="sub">&amp; NITRO DASH</div>
			<div id="bar"><div id="fill"><svg id="knob" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5l4.1 8.6 9.4 1.2-6.9 6.5 1.8 9.3L16 23.6l-8.4 4.5 1.8-9.3-6.9-6.5 9.4-1.2z" fill="#ffd84a" stroke="#7a3d00" stroke-width="2" stroke-linejoin="round"/></svg></div></div>
			<div id="status">Lädt …</div>
			<div id="tip"></div>
			<button id="retry" type="button">↻ Neu laden</button>
		</div>
		<div id="ver">v1.1.6</div>
	</div>

	<div id="rotate"><div class="phone"></div>Bitte das Gerät ins Querformat drehen</div>
	<button id="install" type="button">⬇ Installieren</button>
	<div id="ios-hint">Zum Installieren: <b>Teilen</b> → <b>Zum Home-Bildschirm</b></div>

	<script src="lumos_bridge.js"></script>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const splash = document.getElementById('splash');
	const fill = document.getElementById('fill');
	const status = document.getElementById('status');
	const canvas = document.getElementById('canvas');

	// Audio-Entsperrung: Jeder AudioContext (Godot legt seinen eigenen an) wird bei jeder Nutzer-Geste und bei
	// Rückkehr in den Tab fortgesetzt – zuverlässig auch in iframes (Codespaces, VS-Code-Vorschau) und mit
	// strengen Autoplay-Regeln.
	(function () {
		const ctxs = [];
		const Orig = window.AudioContext || window.webkitAudioContext;
		if (Orig && !Orig.__lumosWrapped) {
			const Wrapped = function (...a) { const c = new Orig(...a); ctxs.push(c); return c; };
			Wrapped.prototype = Orig.prototype;
			Wrapped.__lumosWrapped = true;
			window.AudioContext = Wrapped;
			if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
		}
		const resume = () => ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); });
		['pointerdown', 'pointerup', 'touchend', 'mousedown', 'keydown', 'click'].forEach((e) => window.addEventListener(e, resume, { capture: true, passive: true }));
		document.addEventListener('visibilitychange', () => { if (!document.hidden) resume(); });
		window.addEventListener('focus', resume);
		window.__lumosResumeAudio = resume;
		window.__lumosAudioState = () => ctxs.map((c) => c.state).join(',');
	})();

	// Lumos-OS-Erkennung (Lumos One Handheld injiziert window.LumosCloudSDK bzw. ?lumos=1)
	const params = new URLSearchParams(location.search);
	window.LUMOS_HOST = !!(window.LumosCloudSDK || params.get('lumos') === '1' || /LumosOS/i.test(navigator.userAgent));
	const standalone = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;

	const retryBtn = document.getElementById('retry');
	const tip = document.getElementById('tip');
	let started = false;

	function fail(err) {
		console.error(err);
		status.textContent = (err && err.message) ? err.message : String(err);
		splash.classList.add('error');
		retryBtn.style.display = 'inline-block';
	}

	// Harter Neustart: alte Service Worker & Caches entfernen (häufigste Ursache für hängende Ladebalken
	// nach einem Update), dann ohne HTTP-Cache neu laden.
	async function hardReload() {
		status.textContent = 'Starte neu …';
		try {
			if ('serviceWorker' in navigator) {
				const regs = await navigator.serviceWorker.getRegistrations();
				await Promise.all(regs.map((r) => r.unregister()));
			}
			if (window.caches) {
				const keys = await caches.keys();
				await Promise.all(keys.filter((k) => k.startsWith('lumos-party-')).map((k) => caches.delete(k)));
			}
		} catch (e) { /* egal – trotzdem neu laden */ }
		const u = new URL(location.href);
		u.searchParams.set('fresh', String(Date.now()));
		location.replace(u.toString());
	}
	retryBtn.addEventListener('click', hardReload);

	// Tipps während des Ladens
	const TIPS = [
		'Tipp: Auf Lumos-Stern-Feldern kannst du für 20 Münzen einen Stern kaufen.',
		'Tipp: Driften lädt deinen Mini-Turbo – je länger, desto heißer die Funken!',
		'Tipp: Im Wolkenturm zählen Felder ganz oben doppelt.',
		'Tipp: Partner auf dem Brett begleiten dich drei Runden lang.',
		'Tipp: In den letzten Sekunden eines Minispiels wird die Musik schneller – Endspurt!',
	];
	let tipIdx = Math.floor(Math.random() * TIPS.length);
	const nextTip = () => { tip.style.opacity = 0; setTimeout(() => { tip.textContent = TIPS[tipIdx++ % TIPS.length]; tip.style.opacity = 1; }, 400); };
	nextTip();
	const tipTimer = setInterval(nextTip, 5200);

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error('Diesem Browser fehlen benötigte Funktionen:\n' + missing.join(', ')));
		return;
	}

	// --- Robuster Download der großen Engine-Dateien ---------------------------------------------------------
	// Godots Lader bleibt für immer hängen, wenn ein Download-Stream mittendrin abreißt (der Fehler wird nie
	// weitergereicht – der Balken friert einfach ein). Deshalb laden wir index.wasm / index.pck selbst:
	// Stillstands-Erkennung (15 s ohne neue Daten → Abbruch), Vollständigkeits-Prüfung und bis zu 4 Versuche.
	const SIZES = (GODOT_CONFIG && GODOT_CONFIG.fileSizes) || {};
	const TOTAL = Object.values(SIZES).reduce((a, b) => a + b, 0);
	const got = {};
	let lastData = Date.now();
	function showProgress() {
		if (started) return;
		const loaded = Object.values(got).reduce((a, b) => a + b, 0);
		const pct = TOTAL > 0 ? Math.min(99, Math.floor(loaded / TOTAL * 100)) : 0;
		fill.style.width = Math.max(3, pct) + '%';
		status.textContent = pct >= 99 ? 'Baue Spielwelt auf …' : 'Lädt Spielwelt … ' + pct + ' %';
	}
	const nativeFetch = window.fetch.bind(window);
	const BIG = /(^|\/)index\.(wasm|pck)$/;
	const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
	async function robustFetch(url) {
		const name = new URL(url, location.href).pathname.split('/').pop();
		let lastErr = null;
		for (let attempt = 1; attempt <= 4; attempt++) {
			const ctl = new AbortController();
			let watch = null;
			got[name] = 0;
			try {
				const res = await nativeFetch(url, { signal: ctl.signal, cache: attempt > 1 ? 'reload' : 'default' });
				if (!res.ok) throw new Error('HTTP ' + res.status + ' für ' + name);
				const expect = SIZES[name] || 0;
				const reader = res.body.getReader();
				const chunks = [];
				let n = 0;
				let last = Date.now();
				watch = setInterval(() => { if (Date.now() - last > 15000) ctl.abort(); }, 1000);
				for (;;) {
					const r = await reader.read();
					if (r.done) break;
					chunks.push(r.value);
					n += r.value.length;
					last = lastData = Date.now();
					got[name] = n;
					showProgress();
				}
				clearInterval(watch);
				if (expect && n < expect) throw new Error(name + ' unvollständig (' + n + ' von ' + expect + ' Bytes)');
				const type = name.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
				return new Response(new Blob(chunks, { type: type }), { status: 200, headers: { 'Content-Type': type, 'Content-Length': String(n) } });
			} catch (e) {
				if (watch) clearInterval(watch);
				lastErr = e;
				console.warn('[Lumos] Download von ' + name + ' fehlgeschlagen (Versuch ' + attempt + '/4):', e);
				if (attempt < 4) {
					status.textContent = 'Verbindung hakt – neuer Versuch ' + (attempt + 1) + '/4 …';
					await sleep(800 * attempt);
				}
			}
		}
		throw new Error('Spieldaten konnten nicht geladen werden (' + ((lastErr && lastErr.message) || name) + '). Bitte neu laden.');
	}
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		try {
			if (BIG.test(new URL(url, location.href).pathname)) return robustFetch(url);
		} catch (e) { /* keine gültige URL → normal laden */ }
		return nativeFetch(input, init);
	};

	// Wachhund: Wenn gar nichts mehr passiert (z. B. ein veralteter Service Worker hält die Anfrage fest),
	// nach 30 s eine sichtbare Lösung anbieten – statt eines ewig stehenden Balkens.
	const watchdog = setInterval(() => {
		if (started) { clearInterval(watchdog); return; }
		if (Date.now() - lastData > 30000) {
			status.textContent = 'Das Laden hängt. Ein Neustart behebt das meistens.';
			retryBtn.style.display = 'inline-block';
		}
	}, 2000);

	status.textContent = 'Lädt Engine …';
	engine.startGame({
		onProgress: function () { showProgress(); },
	}).then(() => {
		started = true;
		clearInterval(tipTimer);
		fill.style.width = '100%';
		status.textContent = 'Los geht’s!';
		splash.classList.add('hidden');
		setTimeout(() => splash.remove(), 600);
		canvas.focus();
		registerSW();
	}, fail);

	// Vollbild beim ersten Antippen (Android/Desktop; iOS unterstützt kein Element-Vollbild)
	const goFull = () => {
		if (!standalone && !window.LUMOS_HOST && document.fullscreenEnabled && !document.fullscreenElement && matchMedia('(pointer: coarse)').matches) {
			document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(() => {
				if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
			}).catch(() => {});
		}
	};
	window.addEventListener('pointerdown', goFull, { once: true });

	// PWA: Service Worker erst NACH dem Spielstart registrieren – er darf den Erst-Download nie stören.
	// Danach legt er die großen Dateien im Hintergrund für den Offline-Start ab.
	function registerSW() {
		if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
		navigator.serviceWorker.register('sw.js').then((reg) => {
			const ask = () => { const w = reg.active || reg.waiting || reg.installing; if (w) w.postMessage('cache-core'); };
			if (reg.active) ask(); else navigator.serviceWorker.ready.then(ask);
		}).catch((e) => console.warn('SW:', e));
	}
	let deferred = null;
	const installBtn = document.getElementById('install');
	window.addEventListener('beforeinstallprompt', (e) => {
		e.preventDefault();
		deferred = e;
		if (!window.LUMOS_HOST) installBtn.style.display = 'block';
	});
	installBtn.addEventListener('click', async () => {
		if (!deferred) return;
		installBtn.style.display = 'none';
		deferred.prompt();
		await deferred.userChoice;
		deferred = null;
	});
	const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (isIOS && !standalone && !window.LUMOS_HOST) {
		const hint = document.getElementById('ios-hint');
		setTimeout(() => { hint.style.display = 'block'; setTimeout(() => hint.style.display = 'none', 9000); }, 4000);
	}
	// Kontextmenü & Doppeltipp-Zoom unterbinden
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('gesturestart', (e) => e.preventDefault());
}());
	</script>
</body>
</html>
