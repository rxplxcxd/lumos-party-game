<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#170b33">
	<meta name="description" content="Lumos Party & Nitro Dash – das chaotische 3D-Party-Brettspiel mit 10 Minispielen und ein Arcade-Racer. Exklusiv für Lumos OS, spielbar in jedem Browser.">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Lumos Party">
	<meta name="format-detection" content="telephone=no">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
	<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
:root { --bg: #170b33; --pink: #ff4fb8; --gold: #ffcc33; --blue: #5ab8ff; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff;
	-webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
	font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
#canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
#canvas:focus { outline: none; }
#splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
	background: radial-gradient(circle at 50% 35%, #4b1d8f 0%, #170b33 65%); z-index: 10; transition: opacity .5s; }
#splash.hidden { opacity: 0; pointer-events: none; }
#logo { width: min(34vmin, 220px); height: auto; filter: drop-shadow(0 10px 25px rgba(0,0,0,.45)); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
h1 { margin: 18px 0 0; font-size: min(9vmin, 64px); letter-spacing: 2px; text-shadow: 0 5px 0 #5a1aa0, 0 8px 18px rgba(0,0,0,.5); }
h2 { margin: 2px 0 22px; font-size: min(4.6vmin, 28px); color: var(--gold); letter-spacing: 3px; }
#bar { width: min(70vw, 440px); height: 14px; border-radius: 10px; background: rgba(255,255,255,.15); overflow: hidden; }
#fill { height: 100%; width: 0; border-radius: 10px; background: linear-gradient(90deg, var(--pink), var(--gold), var(--blue)); transition: width .2s; }
#status { margin-top: 12px; font-size: 15px; opacity: .8; min-height: 20px; text-align: center; padding: 0 20px; }
#install { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 20;
	display: none; border: 0; border-radius: 22px; padding: 12px 20px; font-size: 16px; font-weight: 700; color: #fff;
	background: var(--pink); box-shadow: 0 6px 0 #a02a76, 0 10px 24px rgba(0,0,0,.4); cursor: pointer; }
#install:active { transform: translateY(4px); box-shadow: 0 2px 0 #a02a76; }
#rotate { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center;
	background: var(--bg); text-align: center; font-size: 20px; }
#rotate .phone { width: 64px; height: 108px; border: 5px solid #fff; border-radius: 14px; margin-bottom: 18px; animation: turn 2s ease-in-out infinite; }
@keyframes turn { 0%,30% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
#ios-hint { display: none; position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
	background: rgba(23,11,51,.92); border: 2px solid rgba(255,255,255,.2); border-radius: 16px; padding: 10px 16px; font-size: 14px; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas" tabindex="0">Dein Browser unterstützt kein HTML5-Canvas.</canvas>

	<div id="splash">
		<img id="logo" src="icons/icon-512.png" alt="">
		<h1>LUMOS PARTY</h1>
		<h2>&amp; NITRO DASH</h2>
		<div id="bar"><div id="fill"></div></div>
		<div id="status">Lädt …</div>
	</div>

	<div id="rotate"><div class="phone"></div>Bitte das Gerät ins Querformat drehen</div>
	<button id="install" type="button">⬇ Installieren</button>
	<div id="ios-hint">Zum Installieren: <b>Teilen</b> → <b>Zum Home-Bildschirm</b></div>

	<script src="lumos_bridge.js"></script>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const splash = document.getElementById('splash');
	const fill = document.getElementById('fill');
	const status = document.getElementById('status');
	const canvas = document.getElementById('canvas');

	// Audio-Entsperrung: Jeder AudioContext (Godot legt seinen eigenen an) wird bei jeder Nutzer-Geste und bei
	// Rückkehr in den Tab fortgesetzt – zuverlässig auch in iframes (Codespaces, VS-Code-Vorschau) und mit
	// strengen Autoplay-Regeln.
	(function () {
		const ctxs = [];
		const Orig = window.AudioContext || window.webkitAudioContext;
		if (Orig && !Orig.__lumosWrapped) {
			const Wrapped = function (...a) { const c = new Orig(...a); ctxs.push(c); return c; };
			Wrapped.prototype = Orig.prototype;
			Wrapped.__lumosWrapped = true;
			window.AudioContext = Wrapped;
			if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
		}
		const resume = () => ctxs.forEach((c) => { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); });
		['pointerdown', 'pointerup', 'touchend', 'mousedown', 'keydown', 'click'].forEach((e) => window.addEventListener(e, resume, { capture: true, passive: true }));
		document.addEventListener('visibilitychange', () => { if (!document.hidden) resume(); });
		window.addEventListener('focus', resume);
		window.__lumosResumeAudio = resume;
		window.__lumosAudioState = () => ctxs.map((c) => c.state).join(',');
	})();

	// Lumos-OS-Erkennung (Lumos One Handheld injiziert window.LumosCloudSDK bzw. ?lumos=1)
	const params = new URLSearchParams(location.search);
	window.LUMOS_HOST = !!(window.LumosCloudSDK || params.get('lumos') === '1' || /LumosOS/i.test(navigator.userAgent));
	const standalone = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;

	function fail(err) {
		console.error(err);
		status.textContent = (err && err.message) ? err.message : String(err);
		fill.style.background = '#e8364f';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error('Diesem Browser fehlen benötigte Funktionen:\n' + missing.join(', ')));
		return;
	}

	status.textContent = 'Lädt Engine …';
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const pct = Math.round(current / total * 100);
				fill.style.width = pct + '%';
				status.textContent = 'Lädt Spielwelt … ' + pct + ' %';
			}
		},
	}).then(() => {
		fill.style.width = '100%';
		splash.classList.add('hidden');
		setTimeout(() => splash.remove(), 600);
		canvas.focus();
	}, fail);

	// Vollbild beim ersten Antippen (Android/Desktop; iOS unterstützt kein Element-Vollbild)
	const goFull = () => {
		if (!standalone && !window.LUMOS_HOST && document.fullscreenEnabled && !document.fullscreenElement && matchMedia('(pointer: coarse)').matches) {
			document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(() => {
				if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
			}).catch(() => {});
		}
	};
	window.addEventListener('pointerdown', goFull, { once: true });

	// PWA: Service Worker & Installation
	if ('serviceWorker' in navigator && location.protocol !== 'file:') {
		window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW:', e)));
	}
	let deferred = null;
	const installBtn = document.getElementById('install');
	window.addEventListener('beforeinstallprompt', (e) => {
		e.preventDefault();
		deferred = e;
		if (!window.LUMOS_HOST) installBtn.style.display = 'block';
	});
	installBtn.addEventListener('click', async () => {
		if (!deferred) return;
		installBtn.style.display = 'none';
		deferred.prompt();
		await deferred.userChoice;
		deferred = null;
	});
	const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (isIOS && !standalone && !window.LUMOS_HOST) {
		const hint = document.getElementById('ios-hint');
		setTimeout(() => { hint.style.display = 'block'; setTimeout(() => hint.style.display = 'none', 9000); }, 4000);
	}
	// Kontextmenü & Doppeltipp-Zoom unterbinden
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('gesturestart', (e) => e.preventDefault());
}());
	</script>
</body>
</html>
